  </style>
  <!-- Foco (idea), de fondo -->
  <path class="glass" d="M32 4C19.3 4 10 13.6 10 25.6c0 7.7 3.8 13.2 8.2 17.4c2.1 2 3.2 4.2 3.2 7h21.2c0-2.8 1.1-5 3.2-7C50.2 38.8 54 33.3 54 25.6C54 13.6 44.7 4 32 4z"/>
  <rect class="base" x="21.5" y="52" width="21" height="4" rx="2"/>
